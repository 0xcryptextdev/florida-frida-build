name: Florida 17.16.4 - Android Server Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Android architecture'
        required: true
        default: android-arm64
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x86
          - android-x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      FRIDA_VERSION: '17.16.4'
      TARGET_ARCH: ${{ inputs.arch }}

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h .

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK r29
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build flex bison \
            gcc-multilib g++-multilib libc6-dev-i386 \
            python3-dev python3-pip pkg-config
          python -m pip install lief graphlib

      - name: Clone Florida and Frida 17.16.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRIDA_VERSION" \
            https://github.com/Ylarod/Florida.git florida-patches
          git clone --depth 1 --shallow-submodules --recurse-submodules \
            --branch "$FRIDA_VERSION" https://github.com/frida/frida.git frida
          echo "Florida commit: $(git -C florida-patches rev-parse HEAD)"
          echo "Frida commit: $(git -C frida rev-parse HEAD)"
          echo 'Frida tags at HEAD:'
          git -C frida tag --points-at HEAD

      - name: Apply Florida patches (port RPC patch for Frida 17.16.4)
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name 'GitHub Actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          applied=0
          for patch_dir in "$GITHUB_WORKSPACE"/florida-patches/patches/*; do
            [[ -d "$patch_dir" ]] || continue
            name="${patch_dir##*/}"
            target="$GITHUB_WORKSPACE/frida/subprojects/$name"
            if [[ ! -d "$target" ]]; then
              echo "ERROR: missing subproject: $target" >&2
              exit 1
            fi
            patches=( "$patch_dir"/*.patch )
            if (( ${#patches[@]} == 0 )); then
              continue
            fi
            echo "Applying ${#patches[@]} patch(es) for $name"
            if [[ "$name" == 'frida-core' ]]; then
              if [[ "${patches[0]##*/}" != *string_frida_rpc.patch ]]; then
                echo 'ERROR: Unexpected first frida-core patch; refusing to guess.' >&2
                exit 1
              fi
              # The original 2023 patch context differs from Frida 17.16.4.
              # Port exactly its RPC string changes using stable source anchors.
              python - <<'PYRPC'
          from pathlib import Path
          import re

          p = Path('frida/subprojects/frida-core/lib/base/rpc.vala')
          s = p.read_text(encoding='utf-8')
          if 'getRpcStr(' in s:
              raise SystemExit('RPC port already present: unexpected input')

          constructor = re.compile(
              r'(?m)^(?P<indent>[ \t]*)public RpcClient \(RpcPeer peer\) \{[ \t]*\n'
              r'(?P=indent)[ \t]+Object \(peer: peer\);[ \t]*\n'
              r'(?P=indent)\}',
          )
          m = constructor.search(s)
          if m is None or len(constructor.findall(s)) != 1:
              raise SystemExit('Expected RpcClient constructor not found exactly once')
          indent = m.group('indent')
          child = indent + '\t'
          addition = '\n\n' + '\n'.join([
              indent + 'public string getRpcStr(bool quote) {',
              child + 'string result = (string) GLib.Base64.decode((string) GLib.Base64.decode("Wm5KcFpHRTZjbkJq"));',
              child + 'if(quote) {',
              child + '\treturn "\\\"" + result + "\\\"";',
              child + '} else {',
              child + '\treturn result;',
              child + '}',
              indent + '}',
          ])
          s = s[:m.end()] + addition + s[m.end():]

          changes = [
              ('.add_string_value ("frida:rpc")', '.add_string_value (getRpcStr(false))'),
              ('if (json.index_of ("\\\"frida:rpc\\\"") == -1)',
               'if (json.index_of (getRpcStr(true)) == -1)'),
              ('if (type == null || type != "frida:rpc")',
               'if (type == null || type != getRpcStr(false))'),
          ]
          for old, new in changes:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one RPC anchor {old!r}, got {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('RPC_PATCH_PORTED=1')
          PYRPC
              git -C "$target" diff --check
              git -C "$target" add lib/base/rpc.vala
              git -C "$target" commit -m 'Port Florida string_frida_rpc to Frida 17.16.4'
              applied=$((applied + 1))
              if (( ${#patches[@]} > 1 )); then
                ( cd "$target" && git am --3way "${patches[@]:1}" )
                applied=$((applied + ${#patches[@]} - 1))
              fi
            else
              ( cd "$target" && git am --3way "${patches[@]}" )
              applied=$((applied + ${#patches[@]}))
            fi
          done
          if (( applied == 0 )); then
            echo 'ERROR: No Florida patches were found/applied.' >&2
            exit 1
          fi
          echo "PATCHES_APPLIED=$applied"

      - name: Compile frida-server
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT='${{ steps.ndk.outputs.ndk-path }}'
          test -d "$ANDROID_NDK_ROOT"
          mkdir -p "build-$TARGET_ARCH"
          cd "build-$TARGET_ARCH"
          ../frida/configure --host="$TARGET_ARCH"
          make -j2
          test -s subprojects/frida-core/server/frida-server
          echo 'FRIDA_SERVER_BUILD_SUCCESS'

      - name: Package binary and checksums
        shell: bash
        run: |
          set -euo pipefail
          server="build-$TARGET_ARCH/subprojects/frida-core/server/frida-server"
          test -s "$server"
          mkdir -p dist
          out="dist/florida-server-$FRIDA_VERSION-$TARGET_ARCH"
          cp "$server" "$out"
          gzip -9 -c "$out" > "$out.gz"
          (
            cd dist
            sha256sum "$(basename "$out")" "$(basename "$out").gz" > SHA256SUMS.txt
          )
          file "$out"
          cat dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: florida-17.16.4-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
