name: Florida Frida 17.16.4 - Verified 11 Patch Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Android architecture
        required: true
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm
          - android-x86
          - android-x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      FRIDA_VERSION: '17.16.4'
      TARGET_ARCH: ${{ inputs.arch }}

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h .

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build flex bison \
            gcc-multilib g++-multilib libc6-dev-i386 \
            python3-dev python3-pip pkg-config
          # graphlib is part of the Python standard library (3.9+).
          python -m pip install 'lief==0.13.2' 'pyelftools==0.32'

      - name: Clone Frida and Florida at 17.16.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRIDA_VERSION" \
            https://github.com/Ylarod/Florida.git florida-patches
          git clone --depth 1 --shallow-submodules --recurse-submodules \
            --branch "$FRIDA_VERSION" https://github.com/frida/frida.git frida
          echo "Florida: $(git -C florida-patches rev-parse HEAD)"
          echo "Frida:   $(git -C frida rev-parse HEAD)"
          git -C frida tag --points-at HEAD | grep -Fx "$FRIDA_VERSION"
          # A tag existing in both repositories does not imply patch compatibility.
          # These are the exact snapshots audited for the two ports below.
          test "$(git -C florida-patches rev-parse HEAD)" = 6d4b2e88ebe2bace12322db93470b0e68d4240c9
          test "$(git -C frida rev-parse HEAD)" = c9867320e284f790f0db8a327c2e4035eb790fe4
          test "$(git -C frida/subprojects/frida-core rev-parse HEAD)" = 0e1a53ba7ab7615e6c8cc0cf1ee4fc45ab7d0722
          test "$(git -C frida/subprojects/frida-gum rev-parse HEAD)" = 7eddbb15847ac18c15d21ae1cff48103acd944d5

      - name: Fetch reviewed third-party carry fixes
        shell: bash
        run: |
          set -euo pipefail
          # The florida-zygisk project maintains fixes for Florida patches
          # incompatible with newer Frida versions. This is THIRD-PARTY code.
          git clone --depth 1 https://github.com/thelok1s/florida-zygisk.git florida-helpers
          # Commit used by the previously successful Actions run (reproducible build).
          carry_rev=d16a4108d6311771662278d107435270a2c97d7e
          if ! git -C florida-helpers cat-file -e "${carry_rev}^{commit}" 2>/dev/null; then
            git -C florida-helpers fetch --depth 1 origin "$carry_rev"
          fi
          git -C florida-helpers checkout --detach "$carry_rev"
          test -f florida-helpers/scripts/florida_carry.py
          test -f florida-helpers/scripts/anti-anti-frida.py
          echo "Carry helpers commit: $(git -C florida-helpers rev-parse HEAD)"

      - name: Apply all 11 patches with 17.16.4-specific ports (no skipping)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          total=0
          direct=0
          ported=0
          : > skipped-patches.txt
          : > ported-patches.txt
          : > applied-patches.txt
          for patch_dir in "$GITHUB_WORKSPACE"/florida-patches/patches/*; do
            [[ -d "$patch_dir" ]] || continue
            subproject="${patch_dir##*/}"
            target="$GITHUB_WORKSPACE/frida/subprojects/$subproject"
            [[ -d "$target" ]] || { echo "::error::Missing subproject: $subproject"; exit 1; }
            git -C "$target" config user.name 'GitHub Actions'
            git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            for patch in "$patch_dir"/*.patch; do
              label="$subproject/${patch##*/}"
              total=$((total + 1))
              echo "::group::PATCH $label"
              case "$label" in
                frida-core/0001-Florida-string_frida_rpc.patch)
                  # The 17.16.4 constructor has new doc comments. Port the entire
                  # original 0001 edit with exact assertions, not a patch skip.
                  TARGET="$target" python3 - <<'PY_RPC'
          from pathlib import Path
          import os
          p = Path(os.environ['TARGET']) / 'lib/base/rpc.vala'
          old = p.read_text()
          anchor = '\t\t\tObject (peer: peer);\n\t\t}\n'
          if old.count(anchor) != 1:
              raise SystemExit('::error::0001 port: RPC constructor anchor changed')
          if 'public string getRpcStr' in old:
              raise SystemExit('::error::0001 port: RPC already edited unexpectedly')
          method = (
              '\t\tpublic string getRpcStr(bool quote){\n'
              '\t\t\tstring result = (string) GLib.Base64.decode('
              '(string) GLib.Base64.decode("Wm5KcFpHRTZjbkJq"));\n'
              '\t\t\tif(quote){\n'
              '\t\t\t\treturn "\\\"" + result + "\\\"";\n'
              '\t\t\t}else{\n'
              '\t\t\t\treturn result;\n'
              '\t\t\t}\n'
              '\t\t}\n'
          )
          new = old.replace(anchor, anchor + '\n' + method, 1)
          replacements = [
              ('.add_string_value ("frida:rpc")', '.add_string_value (getRpcStr(false))'),
              (r'if (json.index_of ("\"frida:rpc\"") == -1)',
               'if (json.index_of (getRpcStr(true)) == -1)'),
              ('if (type == null || type != "frida:rpc")',
               'if (type == null || type != getRpcStr(false))'),
          ]
          for before, after in replacements:
              if new.count(before) != 1:
                  raise SystemExit('::error::0001 port missing or duplicate original code: ' + before)
              new = new.replace(before, after, 1)
          p.write_text(new)
          print('PORT_0001_ALL_3_RPC_CALL_SITES=OK')
          PY_RPC
                  git -C "$target" add lib/base/rpc.vala
                  git -C "$target" diff --cached --check
                  git -C "$target" commit -m 'Florida: string_frida_rpc (17.16.4 context port)'
                  echo "$label" >> ported-patches.txt
                  ported=$((ported + 1))
                  ;;
                frida-core/0003-Florida-symbol_frida_agent_main.patch)
                  # Only the legacy Windows hunk conflicts. Apply the original
                  # patch's new-file hunk, then port the entrypoint call sites
                  # with exact assertions, including BOTH tests.
                  git -C "$target" apply --check --include='src/anti-anti-frida.py' "$patch"
                  git -C "$target" apply --include='src/anti-anti-frida.py' "$patch"
                  TARGET="$target" python3 - <<'PY_ENTRY'
          from pathlib import Path
          import os
          root = Path(os.environ['TARGET'])
          # Windows has both HAVE_EMBEDDED_ASSETS and installed-library branches.
          # Keep exact per-file counts, and migrate BOTH Windows entrypoints.
          paths = {
              'src/agent-container.vala': 1,
              'src/linux/linux-host-session.vala': 1,
              'src/darwin/darwin-host-session.vala': 1,
              'src/freebsd/freebsd-host-session.vala': 1,
              'src/qnx/qnx-host-session.vala': 1,
              'src/windows/windows-host-session.vala': 2,
              'tests/test-agent.vala': 1,
              'tests/test-injector.vala': 1,
          }
          for rel, expected_count in paths.items():
              p = root / rel
              if not p.is_file():
                  raise SystemExit('::error::0003 missing source file: ' + rel)
              src = p.read_text()
              needle = '"frida_agent_main"'
              if src.count(needle) != expected_count:
                  raise SystemExit(f'::error::0003 expected {expected_count} entrypoints: {rel}')
              p.write_text(src.replace(needle, '"main"'))
              print('PORT_0003_FILE_OK=' + rel)
          if not (root / 'src/anti-anti-frida.py').is_file():
              raise SystemExit('::error::0003 original script was not added')
          PY_ENTRY
                  git -C "$target" add -A
                  # Preserve the historical script byte-for-byte here: 0004,
                  # 0005 and 0007 depend on it, including its missing final LF.
                  # Audit whitespace in the final compatibility script below.
                  git -C "$target" diff --cached --check -- . ':!src/anti-anti-frida.py'
                  git -C "$target" commit -m 'Florida: symbol_frida_agent_main (17.16.4 context port)'
                  echo "$label" >> ported-patches.txt
                  ported=$((ported + 1))
                  ;;
                *)
                  # Remaining patches, INCLUDING original 0004/0005/0007,
                  # MUST apply cleanly; any failure stops the workflow.
                  git -C "$target" am --ignore-whitespace "$patch"
                  echo "$label" >> applied-patches.txt
                  direct=$((direct + 1))
                  ;;
              esac
              echo "PATCH_OK: $label"
              echo '::endgroup::'
            done
          done
          if (( total != 11 || direct != 9 || ported != 2 )); then
            echo "::error::Unexpected coverage: total=$total direct=$direct ported=$ported"
            exit 1
          fi
          [[ ! -s skipped-patches.txt ]] || { echo '::error::Unexpected skips'; exit 1; }
          printf 'PATCHES_TOTAL=%d\nPATCHES_APPLIED_DIRECTLY=%d\nPATCHES_PORTED_FOR_17_16_4=%d\nPATCHES_SKIPPED=0\n' \
            "$total" "$direct" "$ported" | tee patch-summary.txt
          echo 'ALL_11_PATCHES_ACCOUNTED_FOR_NO_SKIPS'

      - name: Apply Florida carry fixes and source validation
        shell: bash
        run: |
          set -euo pipefail
          # All original patches are now applied/ported in order.
          # Replace the legacy ELF rewrite script with the previously audited
          # compatibility version AFTER 0004, 0005, and 0007 git-am commits.
          cp "$GITHUB_WORKSPACE/florida-helpers/scripts/anti-anti-frida.py" \
            frida/subprojects/frida-core/src/anti-anti-frida.py
          cd frida
          python3 "$GITHUB_WORKSPACE/florida-helpers/scripts/florida_carry.py"
          python3 - <<'PY_EMBED'
          from pathlib import Path
          import re
          p = Path('subprojects/frida-core/src/embed-agent.py')
          src = p.read_text()
          # Replace the pinned helper's shell command with checked argv handling.
          # Absent architectures have empty placeholder files, not ELF agents.
          replacement = '''            # FLORIDA_AGENT_PATCH_HOOK_BEGIN
                      if agent is not None:
                          import os
                          patcher = Path(os.environ.get(
                              "FLORIDA_ANTI_ANTI_FRIDA",
                              str(Path(__file__).with_name("anti-anti-frida.py")))).resolve()
                          if not embedded_agent.is_file() or embedded_agent.stat().st_size == 0:
                              raise RuntimeError(f"Missing agent payload: {embedded_agent}")
                          subprocess.run([sys.executable, str(patcher), str(embedded_agent)], check=True)
                      # FLORIDA_AGENT_PATCH_HOOK_END
          '''
          pattern = (r' {12}# --- florida-zygisk carry: robust anti-anti-frida invocation ---\n'
                     r'.*? {12}# --- end carry ---\n')
          updated, count = re.subn(pattern, lambda _: replacement, src, flags=re.S)
          if count != 1:
              raise SystemExit('::error::Expected exactly one pinned embed hook')
          compile(updated, str(p), 'exec')
          p.write_text(updated)
          print('EMBED_HOOK_CHECKED_ARGV=OK')
          PY_EMBED
          git -C subprojects/frida-core diff --check
          git -C subprojects/frida-gum diff --check
          echo 'CARRY_FIXES_COMPLETE'

      - name: Strictly audit all 11 Florida patch effects (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          root = Path('frida/subprojects/frida-core')
          core = root / 'src'
          patches = Path('florida-patches/patches/frida-core')
          script = core / 'anti-anti-frida.py'
          helper = Path('florida-helpers/scripts/anti-anti-frida.py')
          skipped = set(Path('skipped-patches.txt').read_text().splitlines())
          ported = set(Path('ported-patches.txt').read_text().splitlines())
          applied = Path('applied-patches.txt').read_text().splitlines()
          expected_all = {
              'frida-core/0001-Florida-string_frida_rpc.patch',
              'frida-core/0002-Florida-frida_agent_so.patch',
              'frida-core/0003-Florida-symbol_frida_agent_main.patch',
              'frida-core/0004-Florida-thread_gum_js_loop.patch',
              'frida-core/0005-Florida-thread_gmain.patch',
              'frida-core/0006-Florida-protocol_unexpected_command.patch',
              'frida-core/0007-Florida-update-python-script.patch',
              'frida-core/0008-Florida-pool-frida.patch',
              'frida-core/0009-Florida-memfd-name-jit-cache.patch',
              'frida-core/0010-exec-anti-anti-frida.py.patch',
              'frida-gum/0001-Florida-pool-frida.patch',
          }
          expected = {
              'frida-core/0001-Florida-string_frida_rpc.patch',
              'frida-core/0003-Florida-symbol_frida_agent_main.patch',
              'frida-core/0004-Florida-thread_gum_js_loop.patch',
              'frida-core/0005-Florida-thread_gmain.patch',
              'frida-core/0007-Florida-update-python-script.patch',
          }

          def require(condition, detail):
              if not condition:
                  raise SystemExit('::error::SOURCE PATCH AUDIT FAILED: ' + detail)

          # Reject ANY unreviewed skipped patches instead of building a partial Florida server.
          require(not skipped, 'any skipped patch is forbidden: ' + str(sorted(skipped)))
          require(ported == {
              'frida-core/0001-Florida-string_frida_rpc.patch',
              'frida-core/0003-Florida-symbol_frida_agent_main.patch',
          }, 'unexpected 17.16.4 port set: ' + str(sorted(ported)))
          require(len(applied) == 9 and set(applied) == expected_all - ported,
                  'the exact nine original git-am patches are required')
          actual_all = {str(p.relative_to('florida-patches/patches'))
                        for p in Path('florida-patches/patches').glob('*/*.patch')}
          require(actual_all == expected_all, 'unexpected Florida patch manifest')
          for rel in expected:
              require((Path('florida-patches/patches') / rel).exists(), 'missing original patch: ' + rel)

          # 0001: RPC definition + call-site replacements.
          rpc = (root / 'lib/base/rpc.vala').read_text()
          require('public string getRpcStr' in rpc, '0001 RPC helper absent')
          require('Wm5KcFpHRTZjbkJq' in rpc, '0001 RPC encoding absent')
          require(rpc.count('getRpcStr(false)') == 2 and rpc.count('getRpcStr(true)') == 1,
                  '0001 all three RPC call sites must be migrated')
          require('frida:rpc' not in rpc, '0001 original RPC wire literal remains')

          # 0003: target-specific entrypoints and original test-call sites.
          for rel in (
              'agent-container.vala',
              'linux/linux-host-session.vala',
              'darwin/darwin-host-session.vala',
              'freebsd/freebsd-host-session.vala',
              'qnx/qnx-host-session.vala',
              'windows/windows-host-session.vala',
          ):
              f = core / rel
              require(f.exists(), '0003 missing expected source: ' + str(f))
              txt = f.read_text()
              require('"frida_agent_main"' not in txt,
                      '0003 old literal entrypoint in ' + rel)
              require('"main"' in txt, '0003 new literal entrypoint not found in ' + rel)

          # Auditing is read-only: the application step must already fix the tests.
          for rel in ('test-agent.vala', 'test-injector.vala'):
              f = root / 'tests' / rel
              require(f.exists(), '0003 missing expected test source: ' + str(f))
              require('"frida_agent_main"' not in f.read_text(),
                      '0003 original test entrypoint remains: ' + rel)
              require('"main"' in f.read_text(), '0003 new test entrypoint absent: ' + rel)

          # 0003+0004+0005+0007: the helper provides the final cumulative script.
          require(script.is_file(), '0003 final anti-anti-frida.py absent')
          require(script.read_bytes() == helper.read_bytes(),
                  '0003/0004/0005/0007 final agent script differs from pinned carry version')
          s = script.read_text()
          for marker, patch in (
              ('symbol.name == "frida_agent_main"', '0003 symbol rename'),
              ('symbol.name = "main"', '0003 symbol rename'),
              ('gum-js-loop', '0004 thread_gum_js_loop'),
              ('gmain', '0005 thread_gmain'),
              ('gdbus', '0007 updated script'),
              ('FridaScriptEngine', '0007 string revisions'),
              ('GLib-GIO', '0007 string revisions'),
              ('GDBusProxy', '0007 string revisions'),
              ('GumScript', '0007 string revisions'),
          ):
              require(marker in s, patch + ' marker absent')
          embed = (core / 'embed-agent.py').read_text()
          require('FLORIDA_AGENT_PATCH_HOOK_BEGIN' in embed and
                  'subprocess.run([sys.executable, str(patcher), str(embedded_agent)], check=True)' in embed,
                  '0010 agent embedding must use the checked patch hook')
          require('if agent is not None:' in embed and 'os.system(' not in embed,
                  '0010 missing-agent placeholders or shell invocation are not handled')

          # Independently verify every remaining direct patch against final source.
          # Reversing these unaffected hunks must be possible; a counter alone
          # cannot prove that the intended changes survive the carry stage.
          import subprocess
          for label in (
              'frida-core/0002-Florida-frida_agent_so.patch',
              'frida-core/0006-Florida-protocol_unexpected_command.patch',
              'frida-core/0008-Florida-pool-frida.patch',
              'frida-core/0009-Florida-memfd-name-jit-cache.patch',
              'frida-gum/0001-Florida-pool-frida.patch',
          ):
              subproject = label.split('/')[0]
              patch = (Path('florida-patches/patches') / label).resolve()
              subprocess.run(['git', '-C', 'frida/subprojects/' + subproject,
                              'apply', '--reverse', '--check', str(patch)], check=True)
              print('FINAL_SOURCE_HUNK_OK=' + label)

          # Save original patch hashes and final source deltas for later review.
          import hashlib
          manifest = []
          for label in sorted(expected_all):
              digest = hashlib.sha256((Path('florida-patches/patches') / label).read_bytes()).hexdigest()
              manifest.append(digest + '  ' + label)
          Path('PATCH_INPUT_SHA256SUMS.txt').write_text('\n'.join(manifest) + '\n')
          for subproject, base in (
              ('frida-core', '0e1a53ba7ab7615e6c8cc0cf1ee4fc45ab7d0722'),
              ('frida-gum', '7eddbb15847ac18c15d21ae1cff48103acd944d5'),
          ):
              repo = 'frida/subprojects/' + subproject
              subprocess.run(['git', '-C', repo, 'diff', '--check', base], check=True)
              delta = subprocess.check_output(['git', '-C', repo, 'diff', '--binary', base])
              Path(subproject + '-effective.patch').write_bytes(delta)

          # Account for all 11 Florida patches without mislabeling their Git histories.
          lines = [
              'FRIDA_VERSION=17.16.4',
              'EXPECTED_FLORIDA_PATCHES=11',
              'APPLIED_ORIGINAL_GIT_PATCHES=9',
              'PORTED_FOR_17_16_4=2',
              'SKIPPED_PATCHES=0',
              'SOURCE_AUDIT=PASS',
              'NOTE=This verifies source-level equivalents; agent binaries and runtime still require verification.',
          ]
          lines += ['PORT_SOURCE ' + k for k in sorted(ported)]
          Path('effective-patch-report.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          print('FLORIDA_SOURCE_PATCH_COVERAGE=11/11')
          PY_AUDIT
          # Prove source modifications have no whitespace errors.
          git -C frida/subprojects/frida-core diff --check

      - name: Build frida-server
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          FLORIDA_ANTI_ANTI_FRIDA: ${{ github.workspace }}/frida/subprojects/frida-core/src/anti-anti-frida.py
        run: |
          set -euo pipefail
          test -d "$ANDROID_NDK_ROOT"
          test -f "$FLORIDA_ANTI_ANTI_FRIDA"
          mkdir -p "build-$TARGET_ARCH"
          cd "build-$TARGET_ARCH"
          ../frida/configure --host="$TARGET_ARCH"
          make -j2 subprojects/frida-core/server/frida-server
          test -s subprojects/frida-core/server/frida-server
          echo 'FRIDA_SERVER_BUILD_SUCCESS'

      - name: Verify all embedded agent ELFs and defined dynamic entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AGENT'
          from pathlib import Path
          import hashlib
          import io
          import json
          import os
          from elftools.elf.elffile import ELFFile
          from elftools.elf.hash import GNUHashTable, ELFHashTable
          build = Path('build-' + os.environ['TARGET_ARCH'])
          agentdir = build / 'subprojects/frida-core/src/frida-data-agent-blob.S.p'
          # From the pinned frida-core/compat/build.py native/emulated defaults.
          expected = {
              'android-arm64': {'64': (64, 'EM_AARCH64'), '32': (32, 'EM_ARM')},
              'android-arm': {'32': (32, 'EM_ARM')},
              'android-x86_64': {'64': (64, 'EM_X86_64'), '32': (32, 'EM_386'),
                                'arm64': (64, 'EM_AARCH64'), 'arm': (32, 'EM_ARM')},
              'android-x86': {'32': (32, 'EM_386'), 'arm': (32, 'EM_ARM')},
          }[os.environ['TARGET_ARCH']]
          actual = {p.name.removeprefix('frida-agent-').removesuffix('.so'): p
                    for p in agentdir.glob('frida-agent-*.so') if p.stat().st_size > 0}
          if set(actual) != set(expected):
              raise SystemExit(f'::error::AGENT AUDIT FAILED: expected {sorted(expected)}, got {sorted(actual)}')
          records = []
          for flavor, path in sorted(actual.items()):
              data = path.read_bytes()
              if not data.startswith(b'\x7fELF'):
                  raise SystemExit('::error::AGENT AUDIT FAILED: not ELF: ' + str(path))
              elf = ELFFile(io.BytesIO(data))
              if (elf.elfclass, elf.header['e_machine']) != expected[flavor]:
                  raise SystemExit('::error::Wrong ELF architecture: ' + str(path))
              # Android's loader follows PT_DYNAMIC, not section names. LIEF
              # 0.13.2 can leave a stale .gnu.hash section after removing its
              # DT_GNU_HASH tag and rebuilding the active DT_HASH table.
              dynamic = next((s for s in elf.iter_segments()
                              if s.header['p_type'] == 'PT_DYNAMIC'), None)
              if dynamic is None:
                  raise SystemExit('::error::Agent PT_DYNAMIC segment absent: ' + str(path))
              mains = dynamic.get_symbol_by_name('main') or []
              exports = [s for s in mains if s.entry['st_shndx'] != 'SHN_UNDEF'
                         and s.entry['st_info']['bind'] in {'STB_GLOBAL', 'STB_WEAK'}
                         and s.entry['st_info']['type'] == 'STT_FUNC'
                         and s.entry['st_other']['visibility'] in {'STV_DEFAULT', 'STV_PROTECTED'}
                         and s.entry['st_value'] != 0]
              if not exports:
                  raise SystemExit('::error::Defined dynamic main function absent: ' + str(path))
              # Resolve every hash table advertised to the loader by its VA.
              # An orphaned section without a dynamic tag is not a lookup path.
              active_hashes = []
              inactive_sections = []
              for tag, section_name, table_class in (
                  ('DT_GNU_HASH', '.gnu.hash', GNUHashTable),
                  ('DT_HASH', '.hash', ELFHashTable),
              ):
                  address, offset = dynamic.get_table_offset(tag)
                  if address is None:
                      if elf.get_section_by_name(section_name) is not None:
                          inactive_sections.append(section_name)
                      continue
                  if offset is None:
                      raise SystemExit(f'::error::Unmapped {tag} address in {path}')
                  table = table_class(elf, offset, dynamic)
                  resolved = table.get_symbol('main')
                  if resolved is None or not any(resolved.entry == s.entry for s in exports):
                      raise SystemExit(f'::error::ELF hash lookup cannot find main via {tag}: {path}')
                  active_hashes.append({'tag': tag, 'virtual_address': address,
                                        'file_offset': offset, 'main_resolved': True})
              if not active_hashes:
                  raise SystemExit('::error::No loader-visible ELF hash table: ' + str(path))
              # The cumulative 0003/0004/0005/0007 patcher must replace these exact signatures.
              for signature in (b'frida_agent_main', b'gum-js-loop', b'gmain', b'gdbus'):
                  if signature in data:
                      raise SystemExit('::error::AGENT AUDIT FAILED: ' + repr(signature)
                                       + ' still present in ' + str(path))
              rodata = elf.get_section_by_name('.rodata')
              if rodata is None:
                  raise SystemExit('::error::Missing agent .rodata: ' + str(path))
              for signature in (b'FridaScriptEngine', b'GLib-GIO', b'GDBusProxy', b'GumScript'):
                  if signature in rodata.data():
                      raise SystemExit('::error::Unpatched .rodata signature: ' + repr(signature))
              records.append({'file': str(path), 'flavor': flavor, 'bytes': len(data),
                              'sha256': hashlib.sha256(data).hexdigest(),
                              'elf_class': elf.elfclass, 'machine': elf.header['e_machine'],
                              'defined_dynamic_main': True, 'hash_lookup_main': True,
                              'active_hash_tables': active_hashes,
                              'inactive_hash_sections': inactive_sections,
                              'signature_audit': 'PASS'})
              print('ELF_LOADER_HASH_OK: ' + str(path) + ' active=' +
                    ','.join(h['tag'] for h in active_hashes) + ' inactive-sections=' +
                    (','.join(inactive_sections) or 'none'))
              print('AGENT_PATCH_CHECK_OK: ' + str(path) + ' (' + str(len(data)) + ' bytes)')
          Path('agent-audit.json').write_text(json.dumps(records, indent=2) + '\n')
          server_path = build / 'subprojects/frida-core/server/frida-server'
          server = ELFFile(io.BytesIO(server_path.read_bytes()))
          primary = '64' if os.environ['TARGET_ARCH'].endswith('64') else '32'
          if (server.elfclass, server.header['e_machine']) != expected[primary]:
              raise SystemExit('::error::Server ELF architecture does not match selected target')
          report = Path('effective-patch-report.txt')
          report.write_text(report.read_text() + 'AGENT_STATIC_AUDIT=PASS\n')
          print('FLORIDA_AGENT_PATCH_AUDIT_OK')
          PY_AGENT

      - name: Validate binary and package files
        shell: bash
        run: |
          set -euo pipefail
          src="build-$TARGET_ARCH/subprojects/frida-core/server/frida-server"
          test -s "$src"
          if grep -aFq 'frida_agent_main' "$src"; then
            echo '::error::Old frida_agent_main symbol found: entrypoint rename not fully effective'
            exit 1
          fi
          if ! grep -aFq 'Wm5KcFpHRTZjbkJq' "$src"; then
            echo '::error::RPC carry marker not found in binary; cannot validate intended RPC change'
            exit 1
          fi
          echo 'BINARY_CHECKS_OK'
          mkdir -p dist
          out="dist/florida-server-$FRIDA_VERSION-$TARGET_ARCH"
          cp "$src" "$out"
          gzip -9 -c "$out" > "$out.gz"
          cp patch-summary.txt skipped-patches.txt ported-patches.txt applied-patches.txt effective-patch-report.txt dist/
          cp agent-audit.json PATCH_INPUT_SHA256SUMS.txt frida-core-effective.patch frida-gum-effective.patch dist/
          {
            echo "Frida version: $FRIDA_VERSION"
            echo "Florida revision: $(git -C florida-patches rev-parse HEAD)"
            echo "Frida revision: $(git -C frida rev-parse HEAD)"
            echo "Frida core revision: 0e1a53ba7ab7615e6c8cc0cf1ee4fc45ab7d0722"
            echo "Frida gum revision: 7eddbb15847ac18c15d21ae1cff48103acd944d5"
            echo "Carry revision: $(git -C florida-helpers rev-parse HEAD)"
            echo "Workflow revision: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            python --version
            node --version
            echo "Binary checks: BINARY_CHECKS_OK"
            echo "Patch status: see effective-patch-report.txt (direct original vs ported equivalents)."
            echo "Note: static checks do not prove successful runtime injection or every anti-detection behavior."
          } > dist/BUILD_PROVENANCE.txt
          ( cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' |
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          file "$out"
          cat dist/patch-summary.txt
          cat dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: florida-17.16.4-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: florida-diagnostics-${{ inputs.arch }}
          path: |
            *-patches.txt
            patch-summary.txt
            effective-patch-report.txt
            agent-audit.json
            PATCH_INPUT_SHA256SUMS.txt
            *-effective.patch
          if-no-files-found: warn
          retention-days: 14
