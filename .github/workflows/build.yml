name: Build Florida 17.16.4 (manual)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Android target architecture
        required: true
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm
          - android-x86
          - android-x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      FRIDA_VERSION: '17.16.4'
      TARGET_ARCH: ${{ inputs.arch }}

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h .

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK r29
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build flex bison \
            gcc-multilib g++-multilib libc6-dev-i386 \
            python3-dev python3-pip pkg-config
          python -m pip install lief graphlib

      - name: Clone Florida and Frida at 17.16.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRIDA_VERSION" \
            https://github.com/Ylarod/Florida.git florida-patches
          git clone --depth 1 --shallow-submodules --recurse-submodules \
            --branch "$FRIDA_VERSION" https://github.com/frida/frida.git frida
          echo 'Florida commit:'
          git -C florida-patches rev-parse HEAD
          echo 'Frida commit:'
          git -C frida rev-parse HEAD
          echo 'Florida tags at HEAD:'
          git -C florida-patches tag --points-at HEAD
          echo 'Frida tags at HEAD:'
          git -C frida tag --points-at HEAD

      - name: Apply Florida patch series
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name 'GitHub Actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find "$GITHUB_WORKSPACE/florida-patches/patches" -type f -name '*.patch' -print > patch-list.txt
          test -s patch-list.txt
          cat patch-list.txt
