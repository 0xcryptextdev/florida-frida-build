name: Florida Frida 17.16.4 - Carry-fixed Android Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Android architecture
        required: true
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm
          - android-x86
          - android-x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      FRIDA_VERSION: '17.16.4'
      TARGET_ARCH: ${{ inputs.arch }}

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h .

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build flex bison \
            gcc-multilib g++-multilib libc6-dev-i386 \
            python3-dev python3-pip pkg-config
          python -m pip install 'lief==0.13.2' graphlib

      - name: Clone Frida and Florida at 17.16.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRIDA_VERSION" \
            https://github.com/Ylarod/Florida.git florida-patches
          git clone --depth 1 --shallow-submodules --recurse-submodules \
            --branch "$FRIDA_VERSION" https://github.com/frida/frida.git frida
          echo "Florida: $(git -C florida-patches rev-parse HEAD)"
          echo "Frida:   $(git -C frida rev-parse HEAD)"
          git -C frida tag --points-at HEAD | grep -Fx "$FRIDA_VERSION"

      - name: Fetch reviewed third-party carry fixes
        shell: bash
        run: |
          set -euo pipefail
          # The florida-zygisk project maintains fixes for Florida patches
          # incompatible with newer Frida versions. This is THIRD-PARTY code.
          git clone --depth 1 https://github.com/thelok1s/florida-zygisk.git florida-helpers
          test -f florida-helpers/scripts/florida_carry.py
          test -f florida-helpers/scripts/anti-anti-frida.py
          echo "Carry helpers commit: $(git -C florida-helpers rev-parse HEAD)"

      - name: Apply patches independently (no three-way merges)
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name 'GitHub Actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          total=0
          applied=0
          skipped=0
          : > skipped-patches.txt
          for patch_dir in "$GITHUB_WORKSPACE"/florida-patches/patches/*; do
            [[ -d "$patch_dir" ]] || continue
            subproject="${patch_dir##*/}"
            target="$GITHUB_WORKSPACE/frida/subprojects/$subproject"
            if [[ ! -d "$target" ]]; then
              echo "::error::Missing Frida subproject: $subproject"
              exit 1
            fi
            patches=( "$patch_dir"/*.patch )
            for patch in "${patches[@]}"; do
              total=$((total + 1))
              label="$subproject/${patch##*/}"
              echo "::group::PATCH $label"
              if ( cd "$target" && git am --ignore-whitespace "$patch" ); then
                echo "APPLIED: $label"
                applied=$((applied + 1))
              else
                git -C "$target" am --abort || true
                echo "::warning::Original patch could not be applied; carry fixes will repair only known cases: $label"
                echo "$label" >> skipped-patches.txt
                skipped=$((skipped + 1))
              fi
              echo '::endgroup::'
            done
          done
          if (( total == 0 )); then
            echo '::error::No Florida patches found'
            exit 1
          fi
          printf 'PATCHES_TOTAL=%d\nPATCHES_APPLIED_DIRECTLY=%d\nPATCHES_SKIPPED=%d\n' \
            "$total" "$applied" "$skipped" | tee patch-summary.txt
          if (( skipped > 0 )); then
            echo 'Original patches not directly applied:'
            cat skipped-patches.txt
          fi

      - name: Apply Florida carry fixes and source validation
        shell: bash
        run: |
          set -euo pipefail
          cd frida
          python3 "$GITHUB_WORKSPACE/florida-helpers/scripts/florida_carry.py"
          git -C subprojects/frida-core diff --check
          echo 'CARRY_FIXES_COMPLETE'

      - name: Build frida-server
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          FLORIDA_ANTI_ANTI_FRIDA: ${{ github.workspace }}/frida/subprojects/frida-core/src/anti-anti-frida.py
        run: |
          set -euo pipefail
          test -d "$ANDROID_NDK_ROOT"
          test -f "$FLORIDA_ANTI_ANTI_FRIDA"
          mkdir -p "build-$TARGET_ARCH"
          cd "build-$TARGET_ARCH"
          ../frida/configure --host="$TARGET_ARCH"
          make -j2 subprojects/frida-core/server/frida-server
          test -s subprojects/frida-core/server/frida-server
          echo 'FRIDA_SERVER_BUILD_SUCCESS'

      - name: Validate binary and package files
        shell: bash
        run: |
          set -euo pipefail
          src="build-$TARGET_ARCH/subprojects/frida-core/server/frida-server"
          test -s "$src"
          if grep -aFq 'frida_agent_main' "$src"; then
            echo '::error::Old frida_agent_main symbol found: entrypoint rename not fully effective'
            exit 1
          fi
          if ! grep -aFq 'Wm5KcFpHRTZjbkJq' "$src"; then
            echo '::error::RPC carry marker not found in binary; cannot validate intended RPC change'
            exit 1
          fi
          echo 'BINARY_CHECKS_OK'
          mkdir -p dist
          out="dist/florida-server-$FRIDA_VERSION-$TARGET_ARCH"
          cp "$src" "$out"
          gzip -9 -c "$out" > "$out.gz"
          cp patch-summary.txt skipped-patches.txt dist/
          {
            echo "Frida version: $FRIDA_VERSION"
            echo "Florida revision: $(git -C florida-patches rev-parse HEAD)"
            echo "Frida revision: $(git -C frida rev-parse HEAD)"
            echo "Carry revision: $(git -C florida-helpers rev-parse HEAD)"
            echo "Binary checks: BINARY_CHECKS_OK"
            echo "Note: skipped original patches may not be fully reproduced by carry fixes."
          } > dist/BUILD_PROVENANCE.txt
          ( cd dist && sha256sum "$(basename "$out")" "$(basename "$out").gz" > SHA256SUMS.txt )
          file "$out"
          cat dist/patch-summary.txt
          cat dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: florida-17.16.4-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

