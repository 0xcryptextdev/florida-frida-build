name: Build Florida 17.16.4

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Android CPU architecture
        required: true
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm
          - android-x86
          - android-x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      FRIDA_VERSION: '17.16.4'
      TARGET_ARCH: ${{ inputs.arch }}

    steps:
      - name: Prepare disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h .

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK r29
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build flex bison \
            gcc-multilib g++-multilib libc6-dev-i386 \
            python3-dev python3-pip pkg-config
          python -m pip install lief graphlib

      - name: Fetch exact Florida and Frida releases
        run: |
          git clone --depth 1 --branch "$FRIDA_VERSION" \
            https://github.com/Ylarod/Florida.git florida-patches
          git clone --depth 1 --shallow-submodules --recurse-submodules \
            --branch "$FRIDA_VERSION" https://github.com/frida/frida.git frida
          git -C florida-patches describe --tags --always
          git -C frida describe --tags --always

      - name: Apply Florida patch series
        shell: bash
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for patch_dir in "$GITHUB_WORKSPACE"/florida-patches/patches/*; do
            [[ -d "$patch_dir" ]] || continue
            subproject="$(basename "$patch_dir")"
            target="$GITHUB_WORKSPACE/frida/subprojects/$subproject"
            if [[ ! -d "$target" ]]; then
              echo "Missing subproject: $subproject" >&2
              exit 1
            fi
            shopt -s nullglob
            patches=( "$patch_dir"/*.patch )
            shopt -u nullglob
            if (( ${#patches[@]} == 0 )); then
              continue
            fi
            echo "Patching $subproject (${#patches[@]} patch files)"
            ( cd "$target" && git am "${patches[@]}" )
